<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barranquilla Convive - Gestión de Instituciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }</style>
</head>
<body class="min-h-screen text-slate-800 flex overflow-x-hidden">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden"></div>
    <div id="sidebar-target"></div>

    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
        <div id="topbar-target"></div>

        <main class="p-4 md:p-8 space-y-6">
            <!-- KPIs -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Instituciones</span>
                    <h3 class="text-3xl font-black text-slate-800 mt-1">3</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sedes Críticas</span>
                    <h3 class="text-3xl font-black text-rose-500 mt-1">1</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Zona Mayor Riesgo</span>
                    <h3 class="text-xl font-black text-amber-500 mt-2">Riomar</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Docentes Vinculados</span>
                    <h3 class="text-3xl font-black text-slate-800 mt-1">129</h3>
                </div>
            </div>

            <!-- Tabla y Filtros -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                <div class="p-4 md:p-6 border-b border-slate-100 flex flex-col gap-4 lg:flex-row lg:items-center justify-between">
                    <div class="flex flex-col sm:flex-row gap-3 flex-1 max-w-3xl">
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                            <input id="search-input" type="text" placeholder="Buscar por nombre o código DANE..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500">
                        </div>
                        <select class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white cursor-pointer">
                            <option>Filtrar por Localidad</option>
                        </select>
                        <select class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white cursor-pointer">
                            <option>Estado de Riesgo</option>
                        </select>
                    </div>
                    <button class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-plus"></i> Registrar Institución
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[1000px]">
                        <thead>
                            <tr class="bg-slate-50/55 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase">
                                <th class="py-4 px-6">Institución Educativa (IED)</th>
                                <th class="py-4 px-6">Localidad</th>
                                <th class="py-4 px-6">Personal Responsable</th>
                                <th class="py-4 px-6">Personal Docente</th>
                                <th class="py-4 px-6">Semáforo de Alertas</th>
                                <th class="py-4 px-6 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="instituciones-body" class="divide-y divide-slate-100 text-sm text-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="instituciones.js"></script>
</body>
</html>
